<div class="settings-container">
  <div class="settings-header">
    <h1 class="page-title">⚙️ System & User Settings</h1>
    <p class="page-subtitle">Manage account details, application preferences, security, and global EMS configurations.</p>
  </div>

  <div *ngIf="savedMessage" class="alert alert-success">
    ✓ {{ savedMessage }}
  </div>

  <div class="settings-layout">
    <!-- Sidebar Navigation Tabs -->
    <div class="settings-sidebar">
      <button class="nav-tab" [class.active]="activeTab === 'profile'" (click)="setTab('profile')">
        👤 Profile Settings
      </button>
      <button class="nav-tab" [class.active]="activeTab === 'preferences'" (click)="setTab('preferences')">
        🎨 Preferences & Theme
      </button>
      <button class="nav-tab" [class.active]="activeTab === 'security'" (click)="setTab('security')">
        🔒 Security & Password
      </button>
      <button class="nav-tab" [class.active]="activeTab === 'notifications'" (click)="setTab('notifications')">
        🔔 Notifications
      </button>
      <button class="nav-tab" [class.active]="activeTab === 'system'" (click)="setTab('system')">
        🏢 EMS System Config
      </button>
    </div>

    <!-- Content Panel -->
    <div class="settings-content card">
      <!-- Profile Tab -->
      <div *ngIf="activeTab === 'profile'">
        <h2 class="section-title">Personal Profile Details</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" [(ngModel)]="profileData.name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" [(ngModel)]="profileData.email">
        </div>
        <div class="form-row">
          <div class="form-group col">
            <label>Phone Number</label>
            <input type="text" class="form-control" [(ngModel)]="profileData.phone">
          </div>
          <div class="form-group col">
            <label>Department</label>
            <input type="text" class="form-control" [(ngModel)]="profileData.department" readonly>
          </div>
        </div>
        <div class="form-group">
          <label>Job Title</label>
          <input type="text" class="form-control" [(ngModel)]="profileData.jobTitle">
        </div>
      </div>

      <!-- Preferences Tab -->
      <div *ngIf="activeTab === 'preferences'">
        <h2 class="section-title">Application Preferences</h2>
        <div class="form-group">
          <label>System Theme</label>
          <select class="form-control" [(ngModel)]="preferences.theme">
            <option value="light">☀️ Light Theme (Default)</option>
            <option value="dark">🌙 Dark Theme</option>
            <option value="system">🖥️ System Preference</option>
          </select>
        </div>
        <div class="form-group">
          <label>Language</label>
          <select class="form-control" [(ngModel)]="preferences.language">
            <option value="English">English (US)</option>
            <option value="Amharic">Amharic (አማርኛ)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Timezone</label>
          <input type="text" class="form-control" [(ngModel)]="preferences.timezone">
        </div>
      </div>

      <!-- Security Tab -->
      <div *ngIf="activeTab === 'security'">
        <h2 class="section-title">Security & Password</h2>
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" class="form-control" [(ngModel)]="security.currentPassword" placeholder="••••••••">
        </div>
        <div class="form-row">
          <div class="form-group col">
            <label>New Password</label>
            <input type="password" class="form-control" [(ngModel)]="security.newPassword" placeholder="••••••••">
          </div>
          <div class="form-group col">
            <label>Confirm New Password</label>
            <input type="password" class="form-control" [(ngModel)]="security.confirmPassword" placeholder="••••••••">
          </div>
        </div>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="security.enable2FA">
            Enable Two-Factor Authentication (2FA) for extra security
          </label>
        </div>
      </div>

      <!-- Notifications Tab -->
      <div *ngIf="activeTab === 'notifications'">
        <h2 class="section-title">Notification Settings</h2>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="notifications.emailAlerts">
            Receive Email Notifications for important updates
          </label>
        </div>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="notifications.leaveRequestsNotify">
            Notify me when employees submit leave requests
          </label>
        </div>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="notifications.payrollUpdatesNotify">
            Notify me when monthly payroll is processed
          </label>
        </div>
      </div>

      <!-- EMS System Config Tab -->
      <div *ngIf="activeTab === 'system'">
        <h2 class="section-title">Global EMS Configuration</h2>
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" class="form-control" [(ngModel)]="systemConfig.companyName">
        </div>
        <div class="form-row">
          <div class="form-group col">
            <label>Standard Work Start Time</label>
            <input type="time" class="form-control" [(ngModel)]="systemConfig.workStart">
          </div>
          <div class="form-group col">
            <label>Standard Work End Time</label>
            <input type="time" class="form-control" [(ngModel)]="systemConfig.workEnd">
          </div>
        </div>
        <div class="form-group">
          <label>Default Annual Paid Leave Days</label>
          <input type="number" class="form-control" [(ngModel)]="systemConfig.defaultLeaveDays">
        </div>
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" (click)="saveSettings()">💾 Save Changes</button>
      </div>
    </div>
  </div>
</div>
